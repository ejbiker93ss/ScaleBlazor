name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        run: dotnet restore ScaleBlazor/Server/ScaleBlazor.Server.csproj

      - name: Publish Server project
        run: >
          dotnet publish ScaleBlazor/Server/ScaleBlazor.Server.csproj
          --configuration Release
          --output publish/ScaleBlazor

      - name: Zip publish output
        run: Compress-Archive -Path publish/ScaleBlazor/* -DestinationPath publish/ScaleBlazor.zip
        shell: pwsh

      - name: Generate release tag
        id: tag
        run: echo "tag=release-$(Get-Date -AsUTC -Format 'yyyyMMdd-HHmmss')-$("${{ github.sha }}".Substring(0,7))" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: publish/ScaleBlazor.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
